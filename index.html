<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>企业邮箱发信API</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #111; color: #fff; -webkit-font-smoothing: antialiased; }
.scroll-container { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }
.page { position: relative; height: 100vh; width: 100%; scroll-snap-align: start; scroll-snap-stop: always; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.page .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; pointer-events: none; transform: scale(1.06); transition: transform 1.2s cubic-bezier(.22,.61,.36,1); }
.page.in .bg { transform: scale(1); }
.page::after { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,.56); z-index: 1; transition: background .8s ease; }
.inner { position: relative; z-index: 2; width: 100%; max-width: 520px; padding: 0 24px; text-align: center; }
.inner > * { opacity: 0; transform: translateY(22px); transition: opacity .7s cubic-bezier(.22,.61,.36,1), transform .7s cubic-bezier(.22,.61,.36,1); will-change: opacity, transform; }
.page.in .inner > * { opacity: 1; transform: translateY(0); }
.page.in .inner > *:nth-child(1) { transition-delay: .06s; }
.page.in .inner > *:nth-child(2) { transition-delay: .12s; }
.page.in .inner > *:nth-child(3) { transition-delay: .18s; }
.page.in .inner > *:nth-child(4) { transition-delay: .24s; }
.page.in .inner > *:nth-child(5) { transition-delay: .30s; }
.page.in .inner > *:nth-child(6) { transition-delay: .36s; }
.page.in .inner > *:nth-child(7) { transition-delay: .42s; }
.page.in .inner > *:nth-child(8) { transition-delay: .48s; }
.price-item, .points > div, .channels > span { opacity: 0; transform: translateY(14px); transition: opacity .6s cubic-bezier(.22,.61,.36,1), transform .6s cubic-bezier(.22,.61,.36,1); }
.page.in .price-item, .page.in .points > div, .page.in .channels > span { opacity: 1; transform: translateY(0); }
.page.in .price-item:nth-child(1) { transition-delay: .34s; }
.page.in .price-item:nth-child(2) { transition-delay: .40s; }
.page.in .price-item:nth-child(3) { transition-delay: .46s; }
.page.in .points > div:nth-child(1) { transition-delay: .52s; }
.page.in .points > div:nth-child(2) { transition-delay: .58s; }
.page.in .channels > span:nth-child(1) { transition-delay: .62s; }
.page.in .channels > span:nth-child(2) { transition-delay: .68s; }
.page.in .channels > span:nth-child(3) { transition-delay: .74s; }
h1 { font-size: 30px; font-weight: 600; line-height: 1.35; letter-spacing: .5px; margin-bottom: 10px; }
.sub { font-size: 15px; color: #b5b5b5; margin-bottom: 42px; }
.domain { display: inline-block; font-size: 21px; font-weight: 500; letter-spacing: 1px; margin-bottom: 46px; padding: 10px 22px; border: 1px solid rgba(255,255,255,.16); border-radius: 40px; background: rgba(255,255,255,.05); transition: border-color .3s ease, background .3s ease; }
.domain:hover { border-color: rgba(106,176,255,.45); background: rgba(106,176,255,.08); }
.domain em { font-style: normal; color: #6ab0ff; }
.prices { display: flex; justify-content: center; gap: 48px; margin-bottom: 48px; }
.price-item { text-align: center; }
.price-item .label { font-size: 13px; color: #9a9a9a; margin-bottom: 8px; transition: color .25s; }
.price-item .num { font-size: 28px; font-weight: 600; transition: transform .25s ease, color .25s ease; }
.price-item .num small { font-size: 13px; font-weight: 400; color: #9a9a9a; margin-left: 2px; }
.price-item:hover .label { color: #cfcfcf; }
.price-item:hover .num { transform: translateY(-2px); color: #6ab0ff; }
.points { display: flex; flex-direction: column; gap: 13px; align-items: center; font-size: 14px; color: #ccc; }
.points > div { transition: color .25s; }
.points > div:hover { color: #fff; }
.points i { color: #6ab0ff; margin-right: 8px; font-size: 13px; }
.hint { margin-top: 58px; font-size: 13px; color: #777; }
.hint i { display: inline-block; margin-left: 4px; animation: hintFloat 2s ease-in-out infinite; }
@keyframes hintFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(5px); } }
h2 { font-size: 24px; font-weight: 600; margin-bottom: 38px; }
.field { margin-bottom: 8px; }
.field input { width: 100%; padding: 14px 16px; font-size: 15px; color: #fff; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); border-radius: 8px; outline: none; transition: border-color .25s ease, background .25s ease, box-shadow .25s ease; }
.field input::placeholder { color: #8a8a8a; }
.field input:hover { border-color: rgba(255,255,255,.30); }
.field input:focus { border-color: #6ab0ff; background: rgba(106,176,255,.07); box-shadow: 0 0 0 3px rgba(106,176,255,.12); }
.tip { text-align: left; font-size: 12px; color: #777; margin-bottom: 30px; transition: color .25s; }
.buy { width: 100%; padding: 15px; font-size: 16px; font-weight: 600; letter-spacing: 1px; color: #fff; background: #0070e0; border: none; border-radius: 8px; cursor: pointer; transition: background .25s ease, transform .15s ease, box-shadow .25s ease; }
.buy:hover { background: #0080ff; box-shadow: 0 8px 22px -8px rgba(0,128,255,.6); }
.buy:active { background: #005fc0; transform: scale(.985); }
.service { margin-top: 42px; padding-top: 26px; border-top: 1px solid rgba(255,255,255,.12); text-align: left; }
.service .title { font-size: 13px; color: #9a9a9a; margin-bottom: 12px; }
.service .phone { font-size: 20px; font-weight: 600; letter-spacing: 1px; margin-bottom: 16px; transition: color .25s; cursor: default; }
.service .phone:hover { color: #6ab0ff; }
.service .phone i { color: #6ab0ff; margin-right: 8px; font-size: 16px; }
.channels { display: flex; gap: 18px; font-size: 13px; color: #aaa; flex-wrap: wrap; }
.channels > span { transition: color .25s; cursor: default; }
.channels > span:hover { color: #fff; }
.channels i { margin-right: 5px; }
.back { margin-top: 36px; font-size: 13px; color: #777; text-align: center; }
.back i { display: inline-block; margin-left: 4px; animation: hintFloat 2s ease-in-out infinite; }
@media (max-width: 420px) {
  h1 { font-size: 24px; }
  .domain { font-size: 18px; padding: 8px 16px; }
  .prices { gap: 30px; }
  .price-item .num { font-size: 23px; }
  .hint { margin-top: 44px; }
}
</style>
</head>
<body>
<div class="scroll-container" id="scroll"><section class="page" id="page1"><img class="bg" referrerpolicy="no-referrer" src="http://shp.qpic.cn/collector/2515952074/250364bc-b5a5-47ed-b9b7-299e7bc38bb5/0" alt=""><div class="inner"><h1>企业邮箱发信API</h1><p class="sub">用你自己的域名发信</p><p class="domain">自定义 <em>@ccouo.cn</em></p><div class="prices"><div class="price-item"><div class="label">包年</div><div class="num">50<small>元</small></div></div><div class="price-item"><div class="label">包季</div><div class="num">24<small>元</small></div></div><div class="price-item"><div class="label">包月</div><div class="num">8<small>元</small></div></div></div><div class="points"><div><i class="fa-solid fa-check"></i>发信数量无上限</div><div><i class="fa-solid fa-check"></i>自动清理已发邮件</div></div><div class="hint">向下滑动 <i class="fa-solid fa-chevron-down"></i></div></div></section><section class="page" id="page2"><img class="bg" referrerpolicy="no-referrer" src="http://shp.qpic.cn/collector/2515952074/18f29aea-0884-4398-9333-705019eed321/0" alt=""><div class="inner"><h2>购买</h2><div class="field"><input id="contact" type="text" placeholder="输入联系手机号或邮箱" autocomplete="off"></div><button class="buy" id="buyBtn">立即购买</button><div class="service"><div class="title">售后联系方式</div><div class="phone"><i class="fa-solid fa-phone"></i>189 8510 7391</div><div class="channels"><span><i class="fa-brands fa-telegram"></i>Telegram</span><span><i class="fa-brands fa-dingtalk"></i>钉钉</span><span><i class="fa-brands fa-weixin"></i>微信企业同号</span></div></div><div class="back">向上滑动返回 <i class="fa-solid fa-chevron-up"></i></div></div></section></div>
<script>
var allPages = document.querySelectorAll(".page");
var scrollBox = document.getElementById("scroll");
if ("IntersectionObserver" in window) {
  var watcher = new IntersectionObserver(function (list) {
    list.forEach(function (item) {
      if (item.isIntersecting) {
        item.target.classList.add("in");
      } else {
        item.target.classList.remove("in");
      }
    });
  }, { threshold: 0.35 });
  allPages.forEach(function (pg) {
    watcher.observe(pg);
  });
} else {
  allPages.forEach(function (pg) { pg.classList.add("in"); });
}
var inputEl = document.getElementById("contact");
var storageKey = "mail_contact";
try {
  var oldVal = localStorage.getItem(storageKey);
  if (oldVal) inputEl.value = oldVal;
} catch (err) {}
inputEl.addEventListener("input", function () {
  try {
    var now = inputEl.value.trim();
    if (now) {
      localStorage.setItem(storageKey, now);
    } else {
      localStorage.removeItem(storageKey);
    }
  } catch (err) {}
});
var buyBtnEl = document.getElementById("buyBtn");
buyBtnEl.addEventListener("click", function () {
  var val = inputEl.value.trim();
  if (!val) {
    alert("请先填写手机号或邮箱");
    inputEl.focus();
    return;
  }
  var phoneOk = /^1[3-9]\d{9}$/.test(val);
  var mailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val);
  if (!phoneOk && !mailOk) {
    alert("请填写有效的手机号或邮箱");
    inputEl.focus();
    return;
  }
  try { localStorage.setItem(storageKey, val); } catch (err) {}
  
  window.location.href = "pay.html";
});
if (location.hash === "#buy") {
  setTimeout(function () {
    document.getElementById("page2").scrollIntoView({ behavior: "smooth" });
  }, 100);
}
</script>
<meta name="referrer" content="no-referrer">
</body>
</html>
